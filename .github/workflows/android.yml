name: Android CI

env:
  main_project_module: app

permissions: {}

on:
  workflow_dispatch: # Fixes your missing button issue: adds manual trigger support
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: github
            task: assembleGithubDebug # Swapped release for debug to bypass missing signature keys
            display_name: github
          - flavor: foss
            task: assembleFossDebug
            display_name: FOSS
          - flavor: izzy
            task: assembleIzzyDebug
            display_name: Izzy

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'corretto'
          cache: 'gradle'

      # Dynamically creates a placeholder keystore properties file so the compiler doesn't throw a "Missing Config" error
      - name: Configure Dummy Keystore Properties
        run: |
          touch local.properties
          echo "storeFile=mock.jks" > keystore.properties
          echo "storePassword=mock_password" >> keystore.properties
          echo "keyAlias=mock_alias" >> keystore.properties
          echo "keyPassword=mock_password" >> keystore.properties
          chmod +x gradlew

      # Compiles the specific flavor variant
      - name: Build ${{ matrix.flavor }} APK debug
        run: ./gradlew ${{ matrix.task }} --warning-mode all

      # Upload individual ABI artifacts for this runner's flavor (Updated paths to search inside /debug/)
      - name: Upload arm64
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-autogenerated-arm64-v8a-${{ matrix.flavor }}-debug
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/debug/*arm64*.apk

      - name: Upload armeabiv7
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-autogenerated-armeabi-v7a-${{ matrix.flavor }}-debug
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/debug/*armeabi*.apk

      - name: Upload universal
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-autogenerated-universal-${{ matrix.flavor }}-debug
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/debug/*universal*.apk

      - name: Upload x86
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-autogenerated-x86-${{ matrix.flavor }}-debug
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/debug/*x86-*.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: ytdlnis-autogenerated-x86_64-${{ matrix.flavor }}-debug
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/debug/*x86_64*.apk

      - name: Upload Full Folder
        uses: actions/upload-artifact@v4
        with:
          name: YTDLnis APK debug ${{ matrix.display_name }} generated
          path: ${{ env.main_project_module }}/build/outputs/apk/${{ matrix.flavor }}/debug/

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Telegram Message
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Build process finished for ${{ github.repository }}!
            Triggered by: ${{ github.actor }}
            See Actions Run details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
